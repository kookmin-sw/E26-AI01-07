<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 596" width="1040" height="596" role="img" aria-label="Brain Cache 작동 장면 도식">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#57606a"/>
    </marker>
    <style>
      .t  { font-family: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif; }
      .ti { font-size: 21px; font-weight: 700; fill: #1b1f24; }
      .sb { font-size: 13px; fill: #57606a; }
      .lb { font-size: 13.5px; font-weight: 700; fill: #1b1f24; }
      .bd { font-size: 12.5px; fill: #3d444d; }
      .sm { font-size: 11.5px; fill: #57606a; }
      .ac { font-size: 12.5px; font-weight: 700; fill: #1d4ed8; }
      .gd { font-size: 12.5px; font-weight: 700; fill: #15803d; }
    </style>
  </defs>

  <rect x="0" y="0" width="1040" height="596" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1039" height="595" fill="none" stroke="#d0d7de"/>

  <text class="t ti" x="28" y="40">Brain Cache — 작동 장면</text>
  <text class="t sb" x="28" y="63">2040년 10월 어느 화요일 오전 8시 40분, 등교 중인 3학년 학생의 하루가 이미 정리되어 있다.</text>

  <!-- ===== 좌: 흩어진 정보원 ===== -->
  <text class="t lb" x="28" y="100">흩어진 정보원</text>
  <g>
    <rect x="28" y="112" width="246" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t bd" x="44" y="136" font-weight="700">과목 학습 플랫폼</text>
    <text class="t sm" x="44" y="156">과제와 마감이 과목별 화면에 흩어짐</text>
  </g>
  <g>
    <rect x="28" y="186" width="246" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t bd" x="44" y="210" font-weight="700">학과 · 학교 공지</text>
    <text class="t sm" x="44" y="230">내 대상이 아닌 공지가 섞여서 옴</text>
  </g>
  <g>
    <rect x="28" y="260" width="246" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text class="t bd" x="44" y="284" font-weight="700">팀 프로젝트 대화</text>
    <text class="t sm" x="44" y="304">약속과 분담이 대화 기록에 묻힘</text>
  </g>

  <line x1="282" y1="217" x2="322" y2="217" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="t sm" x="289" y="206">읽기</text>

  <!-- ===== 중: 온디바이스 에이전트 ===== -->
  <rect x="330" y="96" width="330" height="290" rx="10" fill="#eff4ff" stroke="#2563eb" stroke-width="1.4"/>
  <text class="t lb" x="350" y="124" fill="#1d4ed8">온디바이스 에이전트</text>
  <text class="t sm" x="350" y="143">학생 기기 안에서 동작한다</text>

  <rect x="350" y="156" width="290" height="52" rx="7" fill="#ffffff" stroke="#c6d4f7"/>
  <text class="t ac" x="364" y="176">① 수집</text>
  <text class="t sm" x="364" y="195">마감 · 과목 · 대상을 뽑아 한 줄로 모음</text>

  <rect x="350" y="216" width="290" height="52" rx="7" fill="#ffffff" stroke="#c6d4f7"/>
  <text class="t ac" x="364" y="236">② 필터</text>
  <text class="t sm" x="364" y="255">내 수강 과목만 남기고 나머지는 보관함으로</text>

  <rect x="350" y="276" width="290" height="52" rx="7" fill="#ffffff" stroke="#c6d4f7"/>
  <text class="t ac" x="364" y="296">③ 재배치</text>
  <text class="t sm" x="364" y="315">변경을 감지해 빈 시간에 작업 시간을 넣음</text>

  <text class="t sm" x="350" y="350">비밀번호를 맡기지 않고 권한만 위임한다.</text>
  <text class="t sm" x="350" y="368">개인 데이터는 기기를 벗어나지 않는다.</text>

  <line x1="668" y1="217" x2="708" y2="217" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="t sm" x="675" y="206">반영</text>

  <!-- ===== 우: 오늘의 하루 ===== -->
  <rect x="716" y="96" width="296" height="290" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text class="t lb" x="734" y="124">오늘의 하루</text>
  <text class="t sm" x="734" y="143">열어보지 않아도 이미 들어와 있다</text>

  <rect x="734" y="156" width="260" height="34" rx="6" fill="#f0f6ff" stroke="#c6d4f7"/>
  <text class="t ac" x="746" y="178">오늘 마감 1건 — 전공 과제</text>

  <line x1="746" y1="206" x2="746" y2="318" stroke="#d0d7de" stroke-width="1.4"/>

  <circle cx="746" cy="212" r="3.5" fill="#57606a"/>
  <text class="t bd" x="760" y="216">09:00 전공 수업</text>

  <circle cx="746" cy="248" r="3.5" fill="#15803d"/>
  <text class="t gd" x="760" y="246">11:00 휴강 → 과제 작업</text>
  <text class="t sm" x="760" y="263">비게 된 시간에 자동으로 배치됨</text>

  <circle cx="746" cy="294" r="3.5" fill="#57606a"/>
  <text class="t bd" x="760" y="298">14:00 팀 회의</text>

  <text class="t sm" x="734" y="340">보관함 공지 7건 — 숨기지 않고 따로 모아 둠</text>

  <!-- ===== 하: 사용 전 / 후 ===== -->
  <line x1="28" y1="404" x2="1012" y2="404" stroke="#d0d7de"/>

  <rect x="28" y="424" width="470" height="136" rx="9" fill="#f6f8fa" stroke="#d0d7de"/>
  <text class="t lb" x="48" y="452">사용 전</text>
  <text class="t bd" x="48" y="478">과목별 화면을 하나씩 열어 과제와 공지를 확인하고,</text>
  <text class="t bd" x="48" y="499">마감일을 내 일정으로 직접 옮겨 적는다.</text>
  <text class="t sm" x="48" y="524">확인을 한 번 건너뛰면 마감이 그대로 지나간다.</text>
  <text class="t sm" x="48" y="544">기억해야 할 것이 많아 수업에 쓸 집중력이 줄어든다.</text>

  <line x1="508" y1="492" x2="536" y2="492" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="544" y="424" width="468" height="136" rx="9" fill="#f0fdf4" stroke="#15803d" stroke-width="1.2"/>
  <text class="t lb" x="564" y="452" fill="#15803d">사용 후</text>
  <text class="t bd" x="564" y="478">아침에 한 번 보면 오늘 마감과 내 과목의 변경 사항만</text>
  <text class="t bd" x="564" y="499">하루 일정 안에 들어와 있다.</text>
  <text class="t sm" x="564" y="524">마감이 바뀌면 일정도 함께 바뀌어, 확인을 잊어도 남는다.</text>
  <text class="t sm" x="564" y="544">기억할 일을 기기에 맡기고 학생은 과제 자체에 집중한다.</text>
</svg>
